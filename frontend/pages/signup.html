<!doctype html>
<html>
  <head>
    <title>Signup</title>

    <link rel="stylesheet" href="../css/signup.css" />
    <link rel="stylesheet" href="../css/header.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <!-- Left -->
      <div class="left-section">
        <img src="../assets/logo.jpeg" alt="Logo" />
        <h3 class="site-title">InterviewHub</h3>
      </div>

      <!-- Center -->
      <div class="nav-icons">
        <a href="../index.html">Home</a>
        <a href="./job.html">Jobs</a>
        <a href="./resume.html">Resume Builder</a>
        <a href="./question.html">Interview Prep</a>
      </div>

      <!-- Right -->
      <div class="right-section">
        <a class="profile" href="./profile.html">
          <i class="fa-regular fa-circle-user"></i>
        </a>

        <h3 id="navUser">Hello, User</h3>
        <a href="./login.html" class="login-btn" id="loginBtn">Login</a>
<button id="logoutBtn" class="login-btn" style="display:none">Logout</button>
      </div>
    </header>

    <!-- SIGNUP FORM -->
    <div class="container">
      <form id="signupForm">
        <h2>Create Account</h2>

        <input type="text" id="signupName" placeholder="Full Name" required />

        <input type="email" id="signupEmail" placeholder="Email" required />

        <input
          type="password"
          id="signupPassword"
          placeholder="Password"
          required
        />

        <!-- <input type="password" id="confirmPassword" placeholder="Confirm Password" required> -->

        <button type="submit">Signup</button>
          <p>Or</p>
        <p>
          Already have an account?
          <a href="./login.html">Login</a>
        </p>
      </form>
    </div>

    <!-- SCRIPTS -->
    <script type="module" src="../js/signup.js"></script>

    <script type="module" src="../js/firebase.js"></script>
    <script type="module" src="../js/name-logout.js"></script>
    <script type="module" src="../js/login-redirect.js"></script>
    <script></script>
  </body>
</html>
