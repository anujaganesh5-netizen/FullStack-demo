<!doctype html>
<html>
  <head>
    <title>Signup</title>
    <link rel="stylesheet" href="../css/signup.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="navbar">
      <!-- Left: Logo + Title -->
      <div class="left-section">
        <img src="../assets/logo.jpeg" alt="Logo" />
        <h3 class="site-title">InterviewHub</h3>
      </div>

      <!-- Center: Icons -->
      <div class="nav-icons">
        <a href="../index.html"> Home </a>

        <a href="./job.html"> Job </a>

        <a href="./resume.html"> Resume </a>

        <a href="./question.html"> Question </a>
      </div>

      <!-- Right: Hello + Login -->
      <div class="right-section">
        <a class="profile" href="./profile.html"> Profile </a>
        <h3 id="navUser">Hello, User</h3>
        <a href="./login.html" class="login-btn" id="loginBtn">Login</a>
        <button type="button" id="logoutBtn" class="login-btn">Logout</button>
      </div>
    </header>
    <div class="container">
      <form id="signupForm">
        <h2>Create Account</h2>

        <input type="text" id="signupName" placeholder="Full Name" required />
        <input type="email" id="signupEmail" placeholder="Email" required />
        <input
          type="password"
          id="signupPassword"
          placeholder="Password"
          required
        />
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm Password"
          required
        />

        <button type="submit">Signup</button>

        <p>
          Already have an account?
          <a href="login.html">Login</a>
        </p>
      </form>
    </div>
    <script src="../js/name & logout.js" type="module"></script>
    <script src="../js/signup.js" type="module"></script>
  </body>
</html>
