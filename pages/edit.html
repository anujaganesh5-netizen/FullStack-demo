<!DOCTYPE html>
<html>
<head>
  <title>Edit Profile</title>
</head>
<body>

<h2>Edit Profile</h2>
<form>

<input id="name" placeholder="Name"><br><br>
<input id="bio" placeholder="Bio"><br><br>
<input id="location" placeholder="Location"><br><br>
<input id="skills" placeholder="Skills (comma separated)"><br><br>

<h3>Education (Single for now)</h3>
<input id="eduTitle" placeholder="College"><br>
<input id="eduSub" placeholder="Course"><br>
<input id="eduDur" placeholder="Duration"><br><br>

<h3>Experience</h3>
<input id="role" placeholder="Role"><br>
<input id="company" placeholder="Company"><br>
<input id="expDur" placeholder="Duration"><br><br>

<button id="saveBtn" type="submit">Save</button>
</form>

<script type="module" src="../js/edit.js"></script>
</body>
</html>
